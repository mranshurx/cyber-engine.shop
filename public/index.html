<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aimhack Proxy Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white flex items-center justify-center h-screen px-4">

    <div class="bg-gray-900 border border-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-6 text-red-500 tracking-wide">AIMHACK PORTAL</h1>

        <!-- License Input Card -->
        <div id="login-section">
            <label class="block text-sm text-gray-400 mb-2">Enter License Key</label>
            <input type="text" id="license-key" placeholder="AMHK-XXXX-XXXX-XXXX" 
                class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 mb-4 text-white placeholder-gray-500 focus:outline-none focus:border-red-500 transition">
            <button onclick="verifyLicense()" 
                class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg transition active:scale-95">
                Verify License Key
            </button>
            <p id="error-msg" class="text-red-400 text-sm mt-3 text-center"></p>
        </div>

        <!-- Dashboard Card -->
        <div id="dashboard-section" class="hidden text-center">
            <div class="bg-green-900/30 border border-green-500/50 text-green-400 py-2 rounded-lg mb-6 text-sm font-medium">
                License Key Active ✅
            </div>

            <!-- Add To Happ Button -->
            <button onclick="copyAndOpenHapp()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-lg transition shadow-lg shadow-blue-600/30 mb-4 active:scale-95 flex items-center justify-center gap-2">
                <span>⚡</span> Add to Happ
            </button>

            <!-- Success Notification -->
            <div id="copied-toast" class="hidden bg-gray-800 border border-blue-500/40 text-blue-300 p-3 rounded-lg text-xs mb-4">
                📋 JSON Config Copied to Clipboard!<br>Launching Happ App...
            </div>

            <p class="text-xs text-gray-500 mb-6 leading-relaxed">
                Once Happ opens, tap <b class="text-gray-300">+</b> at the top right and select <b class="text-gray-300">Import from Clipboard</b>.
            </p>

            <button onclick="logout()" class="text-gray-500 hover:text-gray-400 text-sm">Log out</button>
        </div>
    </div>

    <script>
        let currentKey = "";

        async function verifyLicense() {
            const key = document.getElementById('license-key').value.trim();
            const errorMsg = document.getElementById('error-msg');
            errorMsg.innerText = "";

            if (!key) {
                errorMsg.innerText = "Please enter a license key.";
                return;
            }

            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key })
                });

                const data = await response.json();

                if (data.success) {
                    currentKey = key;
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('dashboard-section').classList.remove('hidden');
                } else {
                    errorMsg.innerText = data.message;
                }
            } catch (err) {
                errorMsg.innerText = "Connection error. Try again.";
            }
        }

        async function copyAndOpenHapp() {
            try {
                // 1. Fetch dynamic JSON configuration from your backend
                const response = await fetch(`/api/get-config?key=${currentKey}`);
                if (!response.ok) {
                    alert("License expired or invalid.");
                    return;
                }

                const configData = await response.json();
                const jsonText = JSON.stringify(configData, null, 2);

                // 2. Copy the JSON config text directly to the user clipboard
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(jsonText);
                } else {
                    // Fallback clipboard method for HTTP / older browsers
                    const textArea = document.createElement("textarea");
                    textArea.value = jsonText;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                }

                // 3. Show notification
                const toast = document.getElementById('copied-toast');
                toast.classList.remove('hidden');

                // 4. Launch Happ App using its specific deep link schema path
                setTimeout(() => {
                    // Method A: Direct deep link path registered by Happ app
                    window.location.href = "happ://add/";
                    
                    // Fallback Method B: Alternative scheme fallback if happ://add/ is blocked
                    setTimeout(() => {
                        window.location.href = "happ://open";
                    }, 500);
                }, 300);

            } catch (err) {
                alert("Failed to fetch configuration.");
            }
        }

        function logout() {
            currentKey = "";
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('license-key').value = "";
            document.getElementById('copied-toast').classList.add('hidden');
        }
    </script>
</body>
</html>
