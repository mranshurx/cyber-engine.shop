<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aimhack Proxy Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white flex items-center justify-center h-screen">

    <div class="bg-gray-900 border border-gray-800 p-8 rounded-2xl shadow-2xl w-96">
        <h1 class="text-2xl font-bold text-center mb-6 text-red-500">Aimhack Portal</h1>

        <!-- Login Card -->
        <div id="login-section">
            <label class="block text-sm text-gray-400 mb-2">Enter License Key</label>
            <input type="text" id="license-key" placeholder="AMHK-XXXX-XXXX-XXXX" 
                class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 mb-4 text-white focus:outline-none focus:border-red-500">
            <button onclick="verifyLicense()" 
                class="w-full bg-red-600 hover:bg-red-700 font-semibold py-2 rounded-lg transition">Verify Key</button>
            <p id="error-msg" class="text-red-400 text-sm mt-3 text-center"></p>
        </div>

        <!-- Dashboard Card (Hidden Initially) -->
        <div id="dashboard-section" class="hidden text-center">
            <div class="bg-green-900/30 border border-green-500 text-green-400 py-2 rounded-lg mb-4 text-sm">
                License Active ✅
            </div>
            <p class="text-gray-400 text-sm mb-6">Download your custom proxy configuration file.</p>
            
            <!-- Download Config File Button -->
            <button onclick="downloadConfig()" 
                class="w-full bg-blue-600 hover:bg-blue-700 font-semibold py-3 rounded-lg transition shadow-lg shadow-blue-600/30 mb-3">
                📥 Download Config File
            </button>
            <p class="text-xs text-gray-500 mb-4">After downloading, open Happ &rarr; Tap '+' &rarr; Import from File.</p>
            
            <button onclick="logout()" class="text-gray-500 hover:text-gray-400 text-sm">Log out</button>
        </div>
    </div>

    <script>
        let currentKey = "";

        async function verifyLicense() {
            const key = document.getElementById('license-key').value.trim();
            const errorMsg = document.getElementById('error-msg');
            errorMsg.innerText = "";

            if (!key) {
                errorMsg.innerText = "Please enter a license key.";
                return;
            }

            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key })
                });

                const data = await response.json();

                if (data.success) {
                    currentKey = key;
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('dashboard-section').classList.remove('hidden');
                } else {
                    errorMsg.innerText = data.message;
                }
            } catch (err) {
                errorMsg.innerText = "Connection error. Try again.";
            }
        }

        async function downloadConfig() {
            try {
                // Fetch the dynamic JSON config directly from your server backend
                const response = await fetch(`/api/get-config?key=${currentKey}`);
                
                if (!response.ok) {
                    alert("License expired or unauthorized.");
                    return;
                }

                const configJson = await response.json();
                
                // Convert JSON object into a downloadable Blob file
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(configJson, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `Aimhack-${currentKey}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();

            } catch (err) {
                alert("Failed to download configuration file.");
            }
        }

        function logout() {
            currentKey = "";
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('license-key').value = "";
        }
    </script>
</body>
</html>
