<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aimhack Proxy Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white flex items-center justify-center min-h-screen px-4">

    <div class="bg-gray-900 border border-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md text-center">
        <h1 class="text-2xl font-bold mb-6 text-red-500 tracking-wide">AIMHACK PORTAL</h1>

        <!-- Login Section -->
        <div id="login-section">
            <label class="block text-sm text-gray-400 mb-2 text-left">Enter License Key</label>
            <input type="text" id="license-key" placeholder="AMHK-XXXX-XXXX-XXXX" 
                class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 mb-4 text-white placeholder-gray-500 focus:outline-none focus:border-red-500 transition">
            <button onclick="verifyLicense()" 
                class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg transition active:scale-95">
                Verify License Key
            </button>
            <p id="error-msg" class="text-red-400 text-sm mt-3 text-center"></p>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" class="hidden">
            <div class="bg-green-900/30 border border-green-500/50 text-green-400 py-2 rounded-lg mb-4 text-sm font-medium">
                License Key Active ✅
            </div>

            <!-- Countdown Timer -->
            <div class="bg-gray-800 border border-gray-700 p-4 rounded-xl mb-6">
                <span class="text-xs text-gray-400 uppercase tracking-widest block mb-1">Time Remaining</span>
                <div id="countdown-timer" class="text-2xl font-mono font-bold text-red-400">
                    00d : 00h : 00m : 00s
                </div>
            </div>

            <!-- Copy JSON Button -->
            <button onclick="copyJsonConfig()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-lg transition shadow-lg shadow-blue-600/30 mb-4 active:scale-95 flex items-center justify-center gap-2">
                <span>📋</span> Copy Config JSON
            </button>

            <!-- Status Box -->
            <div id="success-box" class="hidden bg-gray-800 border border-blue-500/50 text-blue-300 p-4 rounded-xl text-xs mb-4 text-left space-y-1">
                <p class="font-bold text-green-400">✅ JSON Copied to Clipboard!</p>
                <p class="text-gray-300">1. Open <b>Happ</b> app.</p>
                <p class="text-gray-300">2. Tap <b class="text-white">+</b> in the top right.</p>
                <p class="text-gray-300">3. Select <b>Import from Clipboard</b>.</p>
            </div>

            <button onclick="logout()" class="text-gray-500 hover:text-gray-400 text-sm mt-2">Log out</button>
        </div>
    </div>

    <script>
        let currentKey = "";
        let timerInterval = null;
        let expirationTimestamp = null;

        async function verifyLicense() {
            const key = document.getElementById('license-key').value.trim();
            const errorMsg = document.getElementById('error-msg');
            errorMsg.innerText = "";

            if (!key) {
                errorMsg.innerText = "Please enter a license key.";
                return;
            }

            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key })
                });

                const data = await response.json();

                if (data.success) {
                    currentKey = key;
                    expirationTimestamp = new Date(data.expiresAt).getTime();
                    
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('dashboard-section').classList.remove('hidden');

                    startCountdownTimer();
                } else {
                    errorMsg.innerText = data.message;
                }
            } catch (err) {
                errorMsg.innerText = "Connection error. Try again.";
            }
        }

        function startCountdownTimer() {
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = expirationTimestamp - now;

                if (distance <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('countdown-timer').innerHTML = "EXPIRED ❌";
                    alert("Your license key has expired!");
                    logout();
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById('countdown-timer').innerHTML = 
                    `${String(days).padStart(2, '0')}d : ${String(hours).padStart(2, '0')}h : ${String(minutes).padStart(2, '0')}m : ${String(seconds).padStart(2, '0')}s`;
            }, 1000);
        }

        async function copyJsonConfig() {
            try {
                // Fetch the full dynamic JSON from the server (with all Free Fire routes & user key auth)
                const response = await fetch(`/api/get-config?key=${currentKey}`);
                if (!response.ok) {
                    alert("License expired or invalid.");
                    return;
                }

                const configData = await response.json();
                const jsonText = JSON.stringify(configData, null, 2);

                // Copy to phone clipboard securely
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(jsonText);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = jsonText;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                }

                // Show clear step-by-step instructions
                document.getElementById('success-box').classList.remove('hidden');

            } catch (err) {
                alert("Failed to generate configuration JSON.");
            }
        }

        function logout() {
            currentKey = "";
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('license-key').value = "";
            document.getElementById('success-box').classList.add('hidden');
        }
    </script>
</body>
</html>
